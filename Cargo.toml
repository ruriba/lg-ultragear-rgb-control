[package]
name = "lg-ultragear-rgb-control"
version = "1.5.1"
edition = "2021"

[build-dependencies]
winresource = "0.1"
# Compiles src/compute.hlsl to DXBC at build time (only the build host needs
# d3dcompiler_47; the shipped exe never does).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_System_LibraryLoader",
] }

[dependencies]
tray-icon = "0.19"
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same windows tree wasapi pulls (0.62), so only one copy of the Win32
# bindings links into the binary.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",   # below-normal priority + single-instance mutex
    "Win32_Security",           # required by CreateMutexW's signature
    "Win32_System_Registry",    # autostart
    "Win32_Globalization",      # UI language detection
    "Win32_System_Diagnostics_Debug", # debug builds: crash stack tracer
    "Win32_System_Kernel",       # debug builds: exception records (vectored handler)
    "Win32_System_Memory",      # panel close: empty the working set (frees RAM)
    "Win32_UI_WindowsAndMessaging", # message window (event pump, WM_DISPLAYCHANGE)
    "Win32_UI_HiDpi",           # per-monitor DPI awareness (menu/dialog crispness)
    "Win32_System_LibraryLoader",   # GetModuleHandleW + uxtheme dark-mode ordinals
    "Win32_Devices_Display",    # RGB-strip monitor detection (QueryDisplayConfig)
    "Win32_Devices_HumanInterfaceDevice", # GUID_DEVINTERFACE_HID (device notifications)
    "Win32_Graphics_Gdi",       # monitor info for dialog centering
] }
wasapi = "0.24.0"
# HWND of the panel window: close = native hide (Slint's own hide leaves a
# blank surface on re-show), reopen = native show + center.
raw-window-handle = "0.6"
# Software renderer only: no OpenGL runtime in the panel (smaller exe,
# less RAM, immune to GL driver/overlay quirks). femtovg can be restored
# by swapping this line for plain slint = "1.18.1". accessibility (the
# accesskit/UIA bridge, ~a dozen crates) stays off: nothing here uses it
# and it costs real binary size; compat-1-2 (deprecated 1.2-era API
# shims) is replaced by the mandatory compat-1-18 marker alone.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "compat-1-18",
    "raw-window-handle-06",
] }

[profile.release]
# "z" measured CPU-neutral against the default (3) for the sync engine
# under a forced constant 30 fps capture load (interleaved A/B, avg 0.3%
# of total on 12 cores either way): the per-frame cost is dominated by
# driver/DXGI time, not the Rust code, so the ~2 MB smaller binary wins.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# link.exe (MSVC) writes informational chatter to stdout ("Creando biblioteca
# ... y objeto ..."); rustc surfaces it as the `linker_messages` warning since
# 1.81. It carries no information, so allow it — real linker errors still fail
# the build loudly.
[lints.rust]
linker_messages = "allow"
